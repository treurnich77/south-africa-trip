name: Reconcile itinerary budget total

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-itinerary-budget-total.yml'

permissions:
  contents: write

jobs:
  fix-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile paid total and clean up workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('itinerary-source.html')
          text=p.read_text(encoding='utf-8')
          old='Already paid: ~$7,572 USD'
          new='Already paid: ~$7,564 USD'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one stale paid total, found {text.count(old)}')
          text=text.replace(old,new,1)
          if 'Already paid: ~$7,572 USD' in text:
              raise SystemExit('Stale total remains')
          p.write_text(text,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-itinerary-budget-total.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-source.html .github/workflows/fix-itinerary-budget-total.yml
          git commit -m 'Reconcile updated insurance budget total'
          git push
