name: Ukutula fix
on:
  push:
    paths:
      - '.github/workflows/ukutula-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/ukutula_fix.py
      - run: |
          git config user.name itinerary-bot
          git config user.email itinerary-bot@users.noreply.github.com
          git add index.html
          git commit -m "Update Ukutula payment and budget"
          git push
# trigger 2
