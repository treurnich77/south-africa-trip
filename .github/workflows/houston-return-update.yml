name: Houston return update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[houston-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update itinerary
        run: python .github/scripts/houston_return_update.py
      - name: Commit update
        run: |
          git config user.name "treurnich77"
          git config user.email "treurnich77@gmail.com"
          git add index.html
          git commit -m "Add confirmed Houston return hotel and shuttle details [houston-done]"
          git push
