name: Temporary itinerary update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-itinerary-update.yml'

permissions:
  contents: write

jobs:
  update-itinerary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update itinerary source and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('itinerary-source.html')
          s = p.read_text(encoding='utf-8')

          old_nyc = '''<span class="big">Fare:</span> USD 17.25 one way per adult. For 4 people return: 8 journeys × USD 17.25 = <span class="save">USD 138 total</span>.<br>'''
          new_nyc = '''<span class="big">Fare:</span> Budget <span class="save">USD 35 return per person</span> (about USD 17.50 each way). For 4 people return: <span class="save">USD 140 total</span>.<br>'''
          if s.count(old_nyc) != 1:
              raise SystemExit(f'NYC fare anchor count was {s.count(old_nyc)}, expected 1')
          s = s.replace(old_nyc, new_nyc, 1)

          old_airport = '''<div class="info">First night — recover from the long international flight. Collect the rental vehicle at OR Tambo at <b>20:00</b> after customs and baggage, then drive to Airport Inn.</div>'''
          new_airport = '''<div class="info">First night — recover from the long international flight. Collect the rental vehicle at OR Tambo at <b>20:00</b> after customs and baggage, then drive to Airport Inn.</div>
<div class="info">
<b>Vodacom eSIM at OR Tambo — do this after arrival:</b><br>
Ask the Vodacom airport shop to RICA-register a new <b>eSIM</b> using the passport. First choice: <b>PowerFlex R229/month (~USD 13.77)</b> with <b>20 GB Anytime + 20 GB Night Owl</b> (40 GB total per cycle; Night Owl is midnight–05:00).<br><br>
<b>Projected 41-day trip cost:</b> plan on <b>2 × R229 = R458 (~USD 27.55)</b>, giving <b>40 GB Anytime + 40 GB Night Owl = 80 GB total</b> across the two cycles. If the Anytime allowance runs out unusually early, an additional R229 data bundle would bring the high-use contingency to <b>R687 (~USD 41.32)</b> total.<br><br>
<b>If PowerFlex cannot be activated:</b> ask for an ordinary RICA-registered Vodacom prepaid eSIM and buy the <b>R229 prepaid data bundle — 20 GB Anytime + 20 GB Night Owl</b>. Plan on buying it twice over the trip, again totaling about <b>R458 (~USD 27.55)</b>.<br><br>
<b>App issue:</b> VodaPay may not be available from the current Google Play region. Use <b>*135#</b> or Vodacom web self-service to check the balance and buy normal prepaid bundles. Do not default to the more expensive airport Tourist SIM before asking for PowerFlex / ordinary prepaid.<br><br>
Before leaving the Vodacom shop, confirm the eSIM is active, mobile data works, the correct bundle is loaded, the Vodacom number is known, and *135# works.
</div>'''
          if s.count(old_airport) != 1:
              raise SystemExit(f'Airport anchor count was {s.count(old_airport)}, expected 1')
          s = s.replace(old_airport, new_airport, 1)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/temp-itinerary-update.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Vodacom plan and New York rail budget"
          git push origin main
