name: Update New York transport plan

on:
  push:
    paths:
      - '.github/workflows/update-new-york-transport.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update itinerary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('itinerary-source.html')
          html = p.read_text(encoding='utf-8')

          new_section = '''<section class="section" id="newyork">
          <div class="title">Sun Dec 6 — New York / Manhattan Stopover</div>
          <div class="badges"><span class="badge blue">10 HR 25 MIN FLIGHT GAP</span><span class="badge">ABOUT 5–6 USABLE CITY HOURS</span><span class="badge green">NJ TRANSIT — SIMPLEST OPTION</span></div>
          <span class="big">Arrival:</span> Newark (EWR) at 10:25 from Houston<br>
          <span class="big">Onward Flight:</span> Newark (EWR) → Johannesburg at 20:50<br>
          <span class="big">Airport → Manhattan:</span> AirTrain from the terminal to Newark Liberty International Airport Rail Station, then NJ TRANSIT direct to New York Penn Station. The NJ TRANSIT airport ticket includes the AirTrain access fee.<br>
          <span class="big">Fare:</span> USD 17.25 one way per adult. For 4 people return: 8 journeys × USD 17.25 = <span class="save">USD 138 total</span>.<br>
          <span class="big">Tickets:</span> Buy the return journeys together before travelling into Manhattan. <a href="https://webtickets.njtransit.com/" target="_blank">Buy NJ TRANSIT tickets online</a> · <a href="https://www.njtransit.com/ewr" target="_blank">Official EWR rail information</a><br>
          <span class="big">Manhattan plan:</span> Walk as much as practical from Penn Station through Midtown — Times Square / Broadway, Rockefeller Center and Central Park. If a subway or local bus is useful, use OMNY contactless payment rather than buying a separate travel pass.<br>
          <span class="big">Practical usable window:</span> approximately 5–6 hours in the city after allowing realistic airport and transfer time.<br>
          <div class="info"><b>Timing:</b> aim to reach New York Penn Station around 12:00–12:30. Be back at New York Penn Station by about <b>17:00</b> to start the return to Newark. This protects a comfortable margin for the 20:50 Johannesburg departure. If the inbound flight or trip into Manhattan runs late, shorten the city visit rather than the airport margin.</div>
          </section>'''

          pattern = r'<section class="section" id="newyork">[\s\S]*?</section>'
          updated, n = re.subn(pattern, new_section, html, count=1)
          if n != 1:
              raise SystemExit(f'Expected one New York section, found {n}')
          p.write_text(updated, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = re.sub(r'itinerary-source\.html\?v=[0-9-]+', 'itinerary-source.html?v=20261028-3', text)
          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace('south-africa-trip-v2', 'south-africa-trip-v3')
          sw.write_text(s, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'treurnich77'
          git config user.email 'treurnich77@gmail.com'
          git add itinerary-source.html index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Update New York rail transport plan'
          git push
