name: Itinerary update

on: [push]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update itinerary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('itinerary-source.html')
          text = p.read_text(encoding='utf-8')

          if 'Revised Dec 8 Route:' not in text:
              print('Itinerary already updated; nothing to do.')
              raise SystemExit(0)

          def rep(old, new, label):
              global text
              if old not in text:
                  raise SystemExit('Missing expected block: ' + label)
              text = text.replace(old, new)

          rep('<div class="info">Return to Newark conservatively early for the 20:50 Johannesburg departure.</div>', '<div class="info"><b>Timing:</b> aim to be in Manhattan by about 12:00–12:30. Start the return to Newark no later than about 16:00, with a target of being back at EWR around 17:15–17:30 for the 20:50 Johannesburg flight. If the inbound flight or transfer into Manhattan runs late, shorten the city visit rather than the airport margin.</div>', 'New York timing note')

          rep('<div class="info">First Night — recover from long international flight. <b>Revised plan:</b> collect the rental vehicle at OR Tambo on the evening of Dec 7 after customs and baggage, then drive to Airport Inn. Exact revised rental pickup time still to be confirmed with CarFlexi / provider.</div>', '<div class="info">First night — recover from the long international flight. Collect the rental vehicle at OR Tambo at <b>20:00</b> after customs and baggage, then drive to Airport Inn.</div>', 'Dec 7 hotel note')

          rep('<span class="big">Current CarFlexi Booking / Voucher:</span>', '<span class="big">CarFlexi Booking / Voucher:</span>', 'car booking label')
          rep('<span class="big">Current Receipt Number:</span>', '<span class="big">Receipt Number:</span>', 'receipt label')
          rep('<span class="big">Current Amount Already Paid:</span>', '<span class="big">Amount Already Paid:</span>', 'paid label')
          rep('<span class="big">Current Amount Payable at Desk:</span>', '<span class="big">Amount Payable at Desk:</span>', 'desk balance label')
          rep('<div class="info">The Dec 7 evening pickup is now confirmed, so the Fortuner is available for the early Benoni Home Affairs trip on Dec 8. Use the linked current e-Voucher rather than the cancelled CF11E9FD voucher.</div>', '<div class="info">Fortuner pickup is at <b>20:00 on Dec 7</b>, so the vehicle is available for the early Brakpan Home Affairs trip on Dec 8. Use the linked CFD1FD74 e-Voucher; CF11E9FD is cancelled.</div>', 'car note')

          rep('<span class="big">Revised Dec 8 Route:</span>', '<span class="big">Dec 8 Route:</span>', 'Dec 8 heading')
          rep('Morning destination first: <b>Department of Home Affairs — Benoni</b>', 'Morning destination first: <b>Department of Home Affairs — Brakpan</b>', 'Home Affairs branch')
          rep('Address: 52 Woburn Ave, Benoni, 1500', 'Address: Elveko Building, 118 Kingsway Avenue, Brakpan, Gauteng, 1541', 'Home Affairs address')
          rep('<a href="https://www.google.com/maps/search/?api=1&query=Department+of+Home+Affairs+Benoni+52+Woburn+Ave+Benoni" target="_blank">Open Benoni Home Affairs in Google Maps</a>', '<a href="https://www.google.com/maps/search/?api=1&query=Department+of+Home+Affairs+Brakpan+118+Kingsway+Avenue+Brakpan+1541" target="_blank">Open Brakpan Home Affairs in Google Maps</a>', 'Home Affairs map link')
          rep('After Home Affairs: Benoni → Sabie / Wild Forest Inn', 'After Home Affairs: Brakpan → Sabie / Wild Forest Inn', 'Brakpan to Sabie label')
          rep('<span class="big">Estimated Drive:</span> about <b>3 hr 40 min</b> / roughly <b>339 km</b> from Benoni to Sabie.', '<span class="big">Estimated Drive:</span> about <b>3 hr 45 min</b> / roughly <b>340 km</b> from Brakpan to Sabie.', 'Brakpan to Sabie drive')
          rep('<span class="dayhead">Tue Dec 8 — Benoni Home Affairs + Transfer to Sabie:</span>', '<span class="dayhead">Tue Dec 8 — Brakpan Home Affairs + Transfer to Sabie:</span>', 'Dec 8 day heading')
          rep('Leave Airport Inn early with the rental vehicle already collected the previous evening.<br>\nBe at <b>Benoni Home Affairs, 52 Woburn Ave</b> before the 08:00 opening and stand in the queue for the passport application.', 'Leave Airport Inn early with the rental vehicle already collected the previous evening. Allow about <b>30–40 min / roughly 25 km</b> to reach Brakpan from the Kempton Park area, allowing extra margin for morning traffic.<br>\nBe at <b>Brakpan Home Affairs, Elveko Building, 118 Kingsway Avenue</b> before the 08:00 opening and stand in the queue for the passport application.', 'Dec 8 morning instructions')
          rep('If finished by mid-afternoon, drive directly from Benoni to Wild Forest Inn — about 3 hr 40 min / 339 km.', 'If finished by mid-afternoon, drive directly from Brakpan to Wild Forest Inn — about 3 hr 45 min / 340 km.', 'Dec 8 primary drive')
          rep('stay one extra night in the Benoni / Johannesburg area or break the drive farther east.', 'stay one extra night in the Brakpan / East Rand area or break the drive farther east.', 'Dec 8 contingency')
          rep("If you reached Sabie on Dec 8: Bourke's Luck Potholes, Three Rondavels / Blyde Canyon viewpoints, and Moholoholo as originally planned.", "If you reached Sabie on Dec 8: Bourke's Luck Potholes, Three Rondavels / Blyde Canyon viewpoints, and Moholoholo.", 'Dec 9 wording')
          rep('If you overnighted near Benoni instead: drive to Sabie first, then keep the afternoon light.', 'If you overnighted near Brakpan instead: drive to Sabie first, then keep the afternoon light.', 'Dec 9 contingency wording')

          rep('<div class="badges"><span class="badge blue">REVISED PLAN</span><span class="badge">SUN CITY + PILANESBERG BASE</span></div>', '<div class="badges"><span class="badge">SUN CITY + PILANESBERG BASE</span></div>', 'Two Wild Olives badge')
          rep('<span class="big">Revised Check-in:</span>', '<span class="big">Check-in:</span>', 'Two Wild Olives check-in')
          rep('<span class="big">Revised Check-out:</span>', '<span class="big">Check-out:</span>', 'Two Wild Olives check-out')
          rep('<span class="big">Revised Booking Status:</span>', '<span class="big">Booking Status:</span>', 'Two Wild Olives status')
          rep('<span class="big">Original 3-night total:</span> USD 309.86<br>\n<span class="big">Confirmed 2-night total:</span> <b>USD 216.26</b><br>\n<span class="big">Saving from shortening stay:</span> <b>USD 93.60</b><br>', '<span class="big">Total:</span> <b>USD 216.26</b><br>', 'Two Wild Olives price history')
          rep('<div class="info">Revised final-leg shape: Sun City full day Thursday, Pilanesberg full day Friday, lighter Pilanesberg Saturday morning, then Ukutula for the final night.</div>', '<div class="info">Sun City full day Thursday, Pilanesberg full day Friday, lighter Pilanesberg Saturday morning, then Ukutula for the final night.</div>', 'final leg note')

          rep('Two Wild Olives confirmed 2-night total: $216.26 USD — Airbnb change accepted', 'Two Wild Olives 2-night total: $216.26 USD', 'budget Two Wild Olives line')
          text = text.replace('<span class="big">Revised Fuel Budget:</span>', '<span class="big">Fuel Budget:</span>')
          text = text.replace('the revised Pilanesberg / Sun City / Ukutula leg', 'the Pilanesberg / Sun City / Ukutula leg')
          text = text.replace('the revised road-trip plan', 'the road-trip plan')
          rep('<span class="small">This supersedes the previous ~$18,000–$21,000 estimate, which understated fuel and did not fully include the revised Sun City / Pilanesberg / Ukutula final leg.</span><br><br>', '<span class="small">Fuel, the Sun City / Pilanesberg / Ukutula leg, and the booked Houston return overnight are included in this planning total.</span><br><br>', 'budget history note')

          rep('<span class="big">Tuesday Dec 8</span> — Airport Inn → Benoni Home Affairs → Sabie — <b>~355 km</b><br>', '<span class="big">Tuesday Dec 8</span> — Airport Inn → Brakpan Home Affairs → Sabie — <b>~365 km</b><br>', 'daily driving Dec 8')

          leftovers = [line for line in text.splitlines() if re.search(r'\b(revised|now confirmed)\b', line, re.I)]
          if leftovers:
              raise SystemExit('Change-history wording still present:\n' + '\n'.join(leftovers))

          p.write_text(text, encoding='utf-8')

          idx = Path('index.html')
          s = idx.read_text(encoding='utf-8')
          s = s.replace('itinerary-source.html?v=20261028-1', 'itinerary-source.html?v=20261028-2')
          idx.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "treurnich77"
          git config user.email "treurnich77@gmail.com"
          git add itinerary-source.html index.html
          git commit -m "Clean itinerary wording and switch Home Affairs to Brakpan"
          git push
