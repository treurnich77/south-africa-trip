          p.write_text(s)
          PY
      - name: Commit update
        run: |
          git config user.name "treurnich77"
          git config user.email "treurnich77@gmail.com"
          git add index.html
          git commit -m "Update CarFlexi booking and budget [carflexi-done]"
          git push
