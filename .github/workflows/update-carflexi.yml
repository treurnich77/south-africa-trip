name: Update CarFlexi itinerary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch itinerary
        env:
          CARB64: 
          MAPB64: 
        run: python -c "import os,re,base64,json,pathlib; p=pathlib.Path('index.html'); s=p.read_text(); new=base64.b64decode(os.environ['CARB64']).decode(); s,n=re.subn(r'<section class=\"section\" id=\"car\">.*?</section>',new,s,count=1,flags=re.S); assert n==1; reps=json.loads(base64.b64decode(os.environ['MAPB64']).decode()); [None for a,b in reps.items() if not (s:=s.replace(a,b))]; p.write_text(s)"
      - name: Commit update
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add index.html && git commit -m "Update CarFlexi booking and budget [carflexi-done]" && git push