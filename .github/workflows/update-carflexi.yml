          s=s.replace('<span class="big">Projected Additional Spend From Now:</span> <span class="big">~$13,530–$16,450 USD</span>','<span class="big">Projected Additional Spend From Now:</span> <span class="big">~$11,400–$14,320 USD + current CFD1FD74 desk balance</span>')
