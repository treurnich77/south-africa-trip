              raise SystemExit('Old car block not found')
          s=s.replace(old,new)
          s=s.replace('Fortuner rental prepayment: $440.74 USD','Previous CarFlexi CF11E9FD downpayment: $440.74 USD — REFUNDED. Current CFD1FD74 prepayment: see current e-Voucher / My Booking (not stated in confirmation email)')
          s=s.replace('<span class="big">Known Paid Total:</span> <span class="big">~$7,263.58 USD</span>','<span class="big">Known Paid Total excluding the current CFD1FD74 prepayment:</span> <span class="big">~$6,822.84 USD</span><br><span class="small">Add the current CFD1FD74 prepayment shown on the e-Voucher / My Booking once confirmed. The old $440.74 payment has been refunded.</span>')
          s=s.replace('Fortuner rental desk balance: ~$2,130 USD','Fortuner rental desk balance: <b>see current CFD1FD74 e-Voucher / My Booking</b> — the old ~$2,130 figure belonged to the cancelled booking')
          s=s.replace('<span class="big">Known Fixed / Booked Future Commitments:</span> <span class="big">~$6,989 USD</span>','<span class="big">Known Fixed / Booked Future Commitments excluding current CarFlexi desk balance:</span> <span class="big">~$4,859 USD + current CFD1FD74 desk balance</span>')
