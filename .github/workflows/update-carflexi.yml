name: Update CarFlexi itinerary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[carflexi-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update itinerary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<section class="section" id="car">
<div class="title">Mon Dec 7 — Revised Vehicle Pickup at Johannesburg Airport</div>
<div class="badges"><span class="badge">CHANGE REQUESTED</span><span class="badge blue">EVENING PICKUP</span></div>
<span class="big">Vehicle:</span> Toyota Fortuner or Similar<br>
<span class="big">Type:</span> Automatic SUV — 7 Seater Diesel<br>
<span class="big">Rental Voucher:</span> CF11E9FD<br>
<span class="big">Provider Confirmation:</span> 18203683<br>
<span class="big">Original Pickup:</span> Dec 8 2026 — 08:00 — OR Tambo (JNB)<br>
<span class="big">Revised Target Pickup:</span> <b>Evening Dec 7</b>, after arriving at JNB, clearing immigration/customs and collecting baggage — exact time to be confirmed with the rental provider.<br>
<span class="big">Return:</span> Jan 17 2027 — 16:30 — OR Tambo (JNB)<br>
<span class="big">Unlimited Kilometers:</span> Included<br>
<span class="big">Insurance:</span> Full Insurance Package Included<br>
<span class="big">Excess:</span> R40,000<br>
<span class="big">Deposit:</span> R14,800<br>
<span class="big">Fuel Policy:</span> Return Full<br>
<span class="big">Amount Already Paid:</span> USD 440.74<br>
<span class="big">Original Amount Payable at Desk:</span> ZAR 39,438.00 (~$2,130 USD)<br>
<span class="big">Original Estimated Total Vehicle Hire:</span> ~$2,571 USD<br>
<span class="big">Revised Rental Duration:</span> approximately 42 days if the pickup is moved to Dec 7<br>
<span class="big">Extra Day Cost:</span> <b>TBD — provider must reprice the booking</b><br>
<span class="big">Receipt Number:</span> 7945435<br>
<span class="big">CarFlexi Voucher:</span> CF11E9FD
<div class="info">Revised plan: collect the Fortuner on arrival night so the vehicle is already available for the early Benoni Home Affairs trip on Dec 8.</div>
</section>'''
          voucher='https://u38569324.ct.sendgrid.net/ls/click?upn=u001.ajX-2FN7F2k0UGJGiQJ9K4lZV0MsUkHfLBZGf2i9kUZ2PnBmP2REAlWh87t00yzXfXyYObwYs3BmeUU6mXTBiTHfw4Kwxo4IWto5lpTq84PZ0LU9n0Ylnoy4xnVhN-2BuLp0n9NiLeQqLKEgnn5sM8xF0J9DQpVukgLDVEPbjPIfA1gqon-2FpFT6BRhsYAtOVGrTwAh2IxcCHZ-2BZR94CKpI6kI5ucWB34FP5oWGe46zeH3vA-3DELMt_Q8Wwi50Du-2F8Gh9HEVfnsD8K-2FeJnZKrJDcuJwJbDA43N8d6Kkn8UYsbPdD3ETYhroUd-2F3hRkgIb5JpifIO0qezJTq8lGHtzqzpRQQDx5NFXh9pTqYMbaD7vo-2BF7AgNtI6E3SJU7EiWRf9-2BOhFzmCuEpRFetYQKP0eA948kSHhLIHIMm51jLfYXvhj72F0OctDgl2Qcpgm4HmNCua9lfMWnQ-3D-3D'
          new=f'''<section class="section" id="car">
<div class="title">Mon Dec 7 — Fortuner Pickup at Johannesburg Airport (CONFIRMED)</div>
<div class="badges"><span class="badge green">CONFIRMED</span><span class="badge blue">20:00 PICKUP</span></div>
