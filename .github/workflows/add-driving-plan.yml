name: Add daily driving plan

on:
  push:
    paths:
      - '.github/workflows/add-driving-plan.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add-driving-plan.py
      - run: |
          git config user.name itinerary-bot
          git config user.email itinerary-bot@users.noreply.github.com
          git add index.html
          git commit -m "Add daily driving plan section"
          git push
