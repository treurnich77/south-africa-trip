name: Refresh itinerary insurance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-itinerary-insurance.yml'

permissions:
  contents: write

jobs:
  update-itinerary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update itinerary source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('itinerary-source.html')
          text = p.read_text(encoding='utf-8')
          original = text

          # Add a direct Insurance jump link beside Flights.
          if '<a href="#insurance">Insurance</a>' not in text:
              text = text.replace('<a href="#flights">Flights</a>\n', '<a href="#flights">Flights</a>\n<a href="#insurance">Insurance</a>\n', 1)

          # Remove the obsolete end-date warning from the flight section.
          text, n = re.subn(
              r'\n<span class="big">Insurance check:</span> Current travel-insurance certificate is logged through Jan 18 while the revised itinerary now lands back in Managua on Jan 19\. Confirm or extend the policy end date before travel\.',
              '',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Expected to remove 1 obsolete flight insurance warning; removed {n}')

          # Replace the old Trawick block with the current private-safe WorldTrips summary.
          insurance_block = '''<section class="section" id="insurance">
          <div class="title">Travel Insurance (CONFIRMED)</div>
          <div class="badges"><span class="badge green">CONFIRMED</span><span class="badge blue">FULL TRIP — 46 DAYS</span><span class="badge">$0 DEDUCTIBLE</span></div>
          <span class="big">Provider / Administrator:</span> WorldTrips (Tokio Marine HCC group)<br>
          <span class="big">Plan:</span> Atlas Premium America<br>
          <span class="big">Coverage Dates:</span> Dec 5, 2026 – Jan 19, 2027<br>
          <span class="big">Home Country:</span> Nicaragua<br>
          <span class="big">Destinations:</span> United States, South Africa, Germany<br>
          <span class="big">Travellers:</span> All 4 family members<br>
          <span class="big">Premium Paid:</span> USD 1,153.68<br><br>
          <span class="big">Medical Maximum:</span> USD 500,000 per insured person / per covered injury or illness<br>
          <span class="big">Deductible:</span> USD 0<br>
          <span class="big">Medical Expenses:</span> Covered up to the overall maximum, including hospitalization and COVID-19, subject to policy terms and exclusions<br>
          <span class="big">Emergency Medical Evacuation:</span> USD 1,000,000<br>
          <span class="big">Emergency Reunion:</span> USD 150,000<br>
          <span class="big">Repatriation of Remains:</span> Up to the overall maximum<br>
          <span class="big">Trip Interruption:</span> USD 15,000<br>
          <span class="big">Personal Liability:</span> USD 100,000<br>
          <span class="big">Emergency Dental:</span> USD 300<br><br>
          <span class="big">U.S. Provider Network:</span> UnitedHealthcare Options PPO — <a href="https://www.whyuhc.com/worldtrips" target="_blank">Find U.S. Providers</a><br>
          <span class="big">WorldTrips Member Portal:</span> <a href="https://worldtrips.my.site.com/MemberPortal" target="_blank">Open Member Portal</a><br>
          <span class="big">Customer Service:</span> 1-800-605-2282 (within the U.S.) / +1 317-262-2132 (outside the U.S.; collect calls accepted)<br>
          <span class="big">Email:</span> <a href="mailto:service@worldtrips.com">service@worldtrips.com</a><br>
          <span class="big">Claims:</span> Keep original itemized bills and payment receipts; claims must be filed within 60 days of policy termination. <a href="https://www.worldtrips.com/hubfs/downloads/worldtrips-claimants-statement.pdf" target="_blank">Claimant Statement &amp; Authorization</a>
          <div class="info"><b>At a hospital:</b> retrieve the individual WorldTrips / UnitedHealthcare ID card from Gmail and show it to the provider. WorldTrips states that direct payment to providers can be made when the plan administrator is contacted and submitted charges are approved.</div>
          <div class="info"><b>Private documents:</b> the original insurance fulfilment document, Confirmation of Coverage and all four ID cards are kept in Gmail rather than published on this public itinerary. Search the WorldTrips fulfilment email dated Oct 28, 2026.</div>
          </section>'''

          pattern = r'<section class="section">\n<div class="title">Travel Insurance \(CONFIRMED\)</div>.*?</section>'
          text, n = re.subn(pattern, insurance_block, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected to replace 1 Travel Insurance section; replaced {n}')

          # Remove the unnecessary meta-note from the New York stop while keeping the practical timing advice.
          old_ny = '<div class="info">This New York stop is part of the master itinerary in its own right — not merely a connection hidden inside the flight section. Return to Newark conservatively early for the 20:50 Johannesburg departure.</div>'
          new_ny = '<div class="info">Return to Newark conservatively early for the 20:50 Johannesburg departure.</div>'
          if old_ny not in text:
              raise SystemExit('New York meta-note not found')
          text = text.replace(old_ny, new_ny, 1)

          # Update budget figures for the replacement policy. Future commitments are unchanged because insurance is already paid.
          replacements = {
              'Travel insurance: $1,161.84 USD': 'Travel insurance — WorldTrips Atlas Premium America: $1,153.68 USD',
              '<span class="big">Known Paid Total:</span> <span class="big">~$7,572 USD</span>': '<span class="big">Known Paid Total:</span> <span class="big">~$7,564 USD</span>',
              '<span class="big">Projected Total Holiday Cost:</span> <span class="big">~$20,707–$23,527 USD</span>': '<span class="big">Projected Total Holiday Cost:</span> <span class="big">~$20,699–$23,519 USD</span>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected budget text not found: {old}')
              text = text.replace(old, new, 1)

          # Safety checks: obsolete insurance wording must be gone and the new plan must be present once.
          banned = [
              'Safe Travels International',
              'FULL TRIP COVERAGE CURRENTLY LOGGED TO JAN 18',
              'Action before departure:',
              'Insurance check:',
              'Travick International',
          ]
          for phrase in banned:
              if phrase in text:
                  raise SystemExit(f'Obsolete phrase remains: {phrase}')
          if text.count('Atlas Premium America') < 2:
              raise SystemExit('New WorldTrips plan did not appear in both insurance and budget sections')
          if '100511537' in text or 'RA931635' in text or '603100511537' in text:
              raise SystemExit('Sensitive insurance/passport/member identifier detected in public itinerary')
          if text == original:
              raise SystemExit('No changes made')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          grep -q 'WorldTrips (Tokio Marine HCC group)' itinerary-source.html
          grep -q 'Atlas Premium America' itinerary-source.html
          grep -q 'USD 500,000 per insured person / per covered injury or illness' itinerary-source.html
          grep -q '~$7,564 USD' itinerary-source.html
          grep -q '~$20,699–$23,519 USD' itinerary-source.html
          ! grep -q 'Safe Travels International' itinerary-source.html
          ! grep -q 'Action before departure' itinerary-source.html
          ! grep -q '100511537' itinerary-source.html
          rm -f .github/workflows/refresh-itinerary-insurance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add itinerary-source.html .github/workflows/refresh-itinerary-insurance.yml
          git commit -m 'Update WorldTrips insurance and trip budget'
          git push
