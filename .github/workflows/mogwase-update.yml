name: Mogwase update
on:
  push:
    paths:
      - '.github/workflows/mogwase-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/mogwase_update.py
      - run: |
          git config user.name itinerary-bot
          git config user.email itinerary-bot@users.noreply.github.com
          git add index.html
          git commit -m "Update confirmed Mogwase booking and budget"
          git push
