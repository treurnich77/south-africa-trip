name: Add Houston booking references
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[houston-refs-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update itinerary
        run: python .github/scripts/add_houston_booking_refs.py
      - name: Commit update
        run: |
          git config user.name "treurnich77"
          git config user.email "treurnich77@gmail.com"
          git add index.html
          git commit -m "Add Houston Agoda booking references [houston-refs-done]"
          git push
